<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Script Translator (Hugging Face)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #f59e0b; /* Hugging Face Amber/Yellow */
            --border-color: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
        }
        h1 { margin-top: 0; font-size: 1.5rem; color: var(--accent-color); }
        .config-group, .io-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #94a3b8; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        textarea { height: 150px; resize: vertical; font-family: monospace; }
        button {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media(max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h1>Hugging Face Script Translator</h1>
    
    <div class="config-group">
        <label for="apiKey">Hugging Face Access Token (Stored locally in browser)</label>
        <input type="password" id="apiKey" placeholder="hf_...">
    </div>

    <div class="config-group">
        <label for="modelName">Hugging Face Model ID</label>
        <input type="text" id="modelName" value="meta-llama/Llama-3.1-8B-Instruct" placeholder="e.g., Qwen/Qwen2.5-72B-Instruct">
    </div>

    <div class="grid config-group">
        <div>
            <label for="sourceLang">Source Language</label>
            <input type="text" id="sourceLang" value="Python / English">
        </div>
        <div>
            <label for="targetLang">Target Language / Format</label>
            <input type="text" id="targetLang" value="JavaScript">
        </div>
    </div>

    <div class="grid io-group">
        <div>
            <label for="inputScript">Input Script / Code</label>
            <textarea id="inputScript" placeholder="Paste your code or script here..."></textarea>
        </div>
        <div>
            <label for="outputScript">Translated Output</label>
            <textarea id="outputScript" placeholder="Translation will appear here..." readonly></textarea>
        </div>
    </div>

    <button id="translateBtn" onclick="translateScript()">Translate with Hugging Face</button>
</div>

<script>
    document.getElementById('apiKey').value = localStorage.getItem('hf_api_key') || '';

    async function translateScript() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const modelName = document.getElementById('modelName').value.trim();
        const sourceLang = document.getElementById('sourceLang').value.trim();
        const targetLang = document.getElementById('targetLang').value.trim();
        const inputScript = document.getElementById('inputScript').value.trim();
        const outputField = document.getElementById('outputScript');
        const translateBtn = document.getElementById('translateBtn');

        if (!apiKey) {
            alert('Please enter your Hugging Face access token.');
            return;
        }
        if (!inputScript) {
            alert('Please provide a script or code to translate.');
            return;
        }

        localStorage.setItem('hf_api_key', apiKey);

        translateBtn.disabled = true;
        translateBtn.textContent = 'Translating via Hugging Face...';
        outputField.value = '';

        const prompt = `Translate the following script/code from ${sourceLang} to ${targetLang}. Maintain exact logic and structure. Return ONLY the translated code inside markdown blocks without extra explanation:

\`\`\`
${inputScript}
\`\`\``;

        try {
            // Using Hugging Face's OpenAI-compatible router endpoint
            const response = await fetch('https://router.huggingface.co/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: modelName,
                    messages: [{ role: 'user', content: prompt }],
                    max_tokens: 1500,
                    temperature: 0.2
                })
            });

            const data = await response.json();

            if (data.error) {
                throw new Error(data.error.message || JSON.stringify(data.error));
            }

            let result = data.choices[0].message.content.trim();
            
            if (result.startsWith('```')) {
                result = result.replace(/^```[a-zA-Z]*\n/, '').replace(/```$/, '').trim();
            }

            outputField.value = result;

        } catch (error) {
            alert('Error during translation: ' + error.message);
        } finally {
            translateBtn.disabled = false;
            translateBtn.textContent = 'Translate with Hugging Face';
        }
    }
</script>

</body>
</html>
