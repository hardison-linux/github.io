<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Script Translator (Multi-provider)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #f59e0b; /* Accent */
            --border-color: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
        }
        h1 { margin-top: 0; font-size: 1.5rem; color: var(--accent-color); }
        .config-group, .io-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #94a3b8; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        textarea { height: 150px; resize: vertical; font-family: monospace; }
        button {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media(max-width: 600px) { .grid { grid-template-columns: 1fr; } }
        .small { font-size: 0.8rem; color: #94a3b8; margin-top: 6px; }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Script Translator (Multi-provider)</h1>
    
    <div class="config-group">
        <label for="provider">Provider</label>
        <select id="provider" onchange="onProviderChange()">
            <option value="huggingface">Hugging Face</option>
            <option value="openai">OpenAI</option>
            <option value="anthropic">Anthropic</option>
            <option value="cohere">Cohere</option>
            <option value="custom">Custom endpoint</option>
        </select>
        <div class="small">Choose the AI provider to use for translation. Keys are saved locally per provider.</div>
    </div>

    <div class="config-group" id="hf-group">
        <label for="hfApiKey">Hugging Face Access Token (Stored locally in browser)</label>
        <input type="password" id="hfApiKey" placeholder="hf_...">

        <label for="hfModel" style="margin-top:10px">Hugging Face Model ID</label>
        <input type="text" id="hfModel" value="meta-llama/Llama-3.1-8B-Instruct" placeholder="e.g., Qwen/Qwen2.5-72B-Instruct">
    </div>

    <div class="config-group" id="openai-group" style="display:none">
        <label for="openaiKey">OpenAI API Key</label>
        <input type="password" id="openaiKey" placeholder="sk-...">
        <label for="openaiModel" style="margin-top:10px">OpenAI Model</label>
        <input type="text" id="openaiModel" value="gpt-4o-mini" placeholder="e.g., gpt-4o-mini, gpt-4.1">
    </div>

    <div class="config-group" id="anthropic-group" style="display:none">
        <label for="anthropicKey">Anthropic API Key</label>
        <input type="password" id="anthropicKey" placeholder="sk-...">
        <label for="anthropicModel" style="margin-top:10px">Anthropic Model</label>
        <input type="text" id="anthropicModel" value="claude-2.1" placeholder="e.g., claude-2.1">
    </div>

    <div class="config-group" id="cohere-group" style="display:none">
        <label for="cohereKey">Cohere API Key</label>
        <input type="password" id="cohereKey" placeholder="coh_...">
        <label for="cohereModel" style="margin-top:10px">Cohere Model</label>
        <input type="text" id="cohereModel" value="command-nightly" placeholder="e.g., command-nightly">
    </div>

    <div class="config-group" id="custom-group" style="display:none">
        <label for="customEndpoint">Custom Endpoint URL</label>
        <input type="text" id="customEndpoint" placeholder="https://api.example.com/v1/generate">
        <label for="customHeader" style="margin-top:10px">Custom Authorization header value</label>
        <input type="text" id="customHeader" placeholder="Bearer ... or Api-Key ...">
    </div>

    <div class="grid config-group">
        <div>
            <label for="sourceLang">Source Language</label>
            <input type="text" id="sourceLang" value="Python / English">
        </div>
        <div>
            <label for="targetLang">Target Language / Format</label>
            <input type="text" id="targetLang" value="JavaScript">
        </div>
    </div>

    <div class="grid io-group">
        <div>
            <label for="inputScript">Input Script / Code</label>
            <textarea id="inputScript" placeholder="Paste your code or script here..."></textarea>
        </div>
        <div>
            <label for="outputScript">Translated Output</label>
            <textarea id="outputScript" placeholder="Translation will appear here..." readonly></textarea>
        </div>
    </div>

    <button id="translateBtn" onclick="translateScript()">Translate</button>
</div>

<script>
    // Load saved keys and defaults
    function loadSaved() {
        document.getElementById('hfApiKey').value = localStorage.getItem('hf_api_key') || '';
        document.getElementById('hfModel').value = localStorage.getItem('hf_model') || 'meta-llama/Llama-3.1-8B-Instruct';

        document.getElementById('openaiKey').value = localStorage.getItem('openai_api_key') || '';
        document.getElementById('openaiModel').value = localStorage.getItem('openai_model') || 'gpt-4o-mini';

        document.getElementById('anthropicKey').value = localStorage.getItem('anthropic_api_key') || '';
        document.getElementById('anthropicModel').value = localStorage.getItem('anthropic_model') || 'claude-2.1';

        document.getElementById('cohereKey').value = localStorage.getItem('cohere_api_key') || '';
        document.getElementById('cohereModel').value = localStorage.getItem('cohere_model') || 'command-nightly';

        document.getElementById('customEndpoint').value = localStorage.getItem('custom_endpoint') || '';
        document.getElementById('customHeader').value = localStorage.getItem('custom_header') || '';
    }

    loadSaved();

    function onProviderChange() {
        const p = document.getElementById('provider').value;
        ['hf-group','openai-group','anthropic-group','cohere-group','custom-group'].forEach(id => {
            document.getElementById(id).style.display = 'none';
        });
        if (p === 'huggingface') document.getElementById('hf-group').style.display = '';
        if (p === 'openai') document.getElementById('openai-group').style.display = '';
        if (p === 'anthropic') document.getElementById('anthropic-group').style.display = '';
        if (p === 'cohere') document.getElementById('cohere-group').style.display = '';
        if (p === 'custom') document.getElementById('custom-group').style.display = '';
    }

    onProviderChange();

    async function translateScript() {
        const provider = document.getElementById('provider').value;
        const sourceLang = document.getElementById('sourceLang').value.trim();
        const targetLang = document.getElementById('targetLang').value.trim();
        const inputScript = document.getElementById('inputScript').value.trim();
        const outputField = document.getElementById('outputScript');
        const translateBtn = document.getElementById('translateBtn');

        if (!inputScript) { alert('Please provide a script or code to translate.'); return; }

        // Save keys/models per provider
        localStorage.setItem('hf_api_key', document.getElementById('hfApiKey').value.trim());
        localStorage.setItem('hf_model', document.getElementById('hfModel').value.trim());
        localStorage.setItem('openai_api_key', document.getElementById('openaiKey').value.trim());
        localStorage.setItem('openai_model', document.getElementById('openaiModel').value.trim());
        localStorage.setItem('anthropic_api_key', document.getElementById('anthropicKey').value.trim());
        localStorage.setItem('anthropic_model', document.getElementById('anthropicModel').value.trim());
        localStorage.setItem('cohere_api_key', document.getElementById('cohereKey').value.trim());
        localStorage.setItem('cohere_model', document.getElementById('cohereModel').value.trim());
        localStorage.setItem('custom_endpoint', document.getElementById('customEndpoint').value.trim());
        localStorage.setItem('custom_header', document.getElementById('customHeader').value.trim());

        translateBtn.disabled = true;
        translateBtn.textContent = 'Translating...';
        outputField.value = '';

        const prompt = `Translate the following script/code from ${sourceLang} to ${targetLang}. Maintain exact logic and structure. Return ONLY the translated code (no explanation).\n\n\`\`\`\n${inputScript}\n\`\`\``;

        try {
            let result = '';

            if (provider === 'huggingface') {
                const apiKey = localStorage.getItem('hf_api_key') || '';
                const modelName = (localStorage.getItem('hf_model') || document.getElementById('hfModel').value).trim();
                if (!apiKey) throw new Error('Hugging Face API key is required.');

                const res = await fetch('https://router.huggingface.co/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ model: modelName, messages: [{ role: 'user', content: prompt }], max_tokens: 1500, temperature: 0.2 })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
                result = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || JSON.stringify(data);
            }
            else if (provider === 'openai') {
                const apiKey = localStorage.getItem('openai_api_key') || '';
                const model = (localStorage.getItem('openai_model') || document.getElementById('openaiModel').value).trim();
                if (!apiKey) throw new Error('OpenAI API key is required.');

                // OpenAI Chat Completions
                const res = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ model, messages: [{ role: 'user', content: prompt }], max_tokens: 1500, temperature: 0.2 })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error.message || JSON.stringify(data));
                result = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || JSON.stringify(data);
            }
            else if (provider === 'anthropic') {
                const apiKey = localStorage.getItem('anthropic_api_key') || '';
                const model = (localStorage.getItem('anthropic_model') || document.getElementById('anthropicModel').value).trim();
                if (!apiKey) throw new Error('Anthropic API key is required.');

                // Anthropic completion API (prompt style). Different Anthropic models/endpoints may require different bodies; this is a typical example.
                const anthropicPrompt = `\n\nHuman: ${prompt}\n\nAssistant:`;
                const res = await fetch('https://api.anthropic.com/v1/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey },
                    body: JSON.stringify({ model, prompt: anthropicPrompt, max_tokens: 1500, temperature: 0.2 })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error.message || JSON.stringify(data));
                result = (data.completion) || JSON.stringify(data);
            }
            else if (provider === 'cohere') {
                const apiKey = localStorage.getItem('cohere_api_key') || '';
                const model = (localStorage.getItem('cohere_model') || document.getElementById('cohereModel').value).trim();
                if (!apiKey) throw new Error('Cohere API key is required.');

                const res = await fetch('https://api.cohere.ai/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ model, prompt, max_tokens: 1500, temperature: 0.2 })
                });
                const data = await res.json();
                if (data.message) throw new Error(data.message || JSON.stringify(data));
                result = (data.generations && data.generations[0] && data.generations[0].text) || JSON.stringify(data);
            }
            else if (provider === 'custom') {
                const endpoint = localStorage.getItem('custom_endpoint') || document.getElementById('customEndpoint').value.trim();
                const headerVal = localStorage.getItem('custom_header') || document.getElementById('customHeader').value.trim();
                if (!endpoint) throw new Error('Custom endpoint is required for provider "Custom".');

                // Generic POST to custom endpoint. We send {prompt} but the custom API may expect different fields.
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', ...(headerVal ? { 'Authorization': headerVal } : {}) },
                    body: JSON.stringify({ prompt })
                });
                const data = await res.json();
                // Try common fields
                result = data.result || data.output || data.choices && data.choices[0] && (data.choices[0].text || (data.choices[0].message && data.choices[0].message.content)) || JSON.stringify(data);
            }

            // Strip fenced code if present
            if (typeof result === 'string') {
                result = result.trim();
                if (result.startsWith('```')) {
                    result = result.replace(/^```[a-zA-Z]*\n/, '').replace(/```$/, '').trim();
                }
            } else {
                result = JSON.stringify(result, null, 2);
            }

            outputField.value = result;

        } catch (error) {
            alert('Error during translation: ' + (error.message || error));
        } finally {
            translateBtn.disabled = false;
            translateBtn.textContent = 'Translate';
        }
    }
</script>

</body>
</html>
